name: Feature request
description: Suggest an idea for Wisp
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Wisp to do?
      description: Describe the problem or moment you have in mind, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: local
    attributes:
      label: Privacy
      options:
        - label: This can work fully on-device, or as an opt-in that is clearly labelled
