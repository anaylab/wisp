<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Wisp</title>
  <desc id="desc">The Wisp notch island cycling through things you can say: point at a button, text someone, arrange windows, watch the screen, add a page to the brain.</desc>
  <defs>
    <radialGradient id="bg" cx="0.72" cy="0.18" r="1.1">
      <stop offset="0" stop-color="#2A2C30"/>
      <stop offset="0.45" stop-color="#191B18"/>
      <stop offset="1" stop-color="#0C0D0B"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AAA7D9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#AAA7D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signature" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#9AA88F">
        <animate attributeName="stop-color" values="#9AA88F;#C9CBC1;#AAA7D9;#9AA88F" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#C9CBC1">
        <animate attributeName="stop-color" values="#C9CBC1;#AAA7D9;#9AA88F;#C9CBC1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#AAA7D9">
        <animate attributeName="stop-color" values="#AAA7D9;#9AA88F;#C9CBC1;#AAA7D9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="signatureStatic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA88F"/>
      <stop offset="0.5" stop-color="#C9CBC1"/>
      <stop offset="1" stop-color="#AAA7D9"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-60" y="-60" width="220" height="220">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- The Wisp ribbon, in a 100×100 box (same curve as WispRibbonShape). -->
    <path id="ribbon" d="M10 64 C14 40 28 28 42 30 C56 32 58 68 68 68 C78 68 84 42 90 36"/>
    <clipPath id="frame"><rect width="1280" height="640" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <ellipse cx="640" cy="300" rx="420" ry="220" fill="url(#aura)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Faint dot grid, like a desktop behind the island. -->
    <g fill="#F7F6F2" opacity="0.05">
      <circle cx="80" cy="120" r="1.5"/><circle cx="140" cy="180" r="1.5"/><circle cx="210" cy="90" r="1.5"/>
      <circle cx="1080" cy="140" r="1.5"/><circle cx="1180" cy="210" r="1.5"/><circle cx="1130" cy="80" r="1.5"/>
      <circle cx="120" cy="520" r="1.5"/><circle cx="230" cy="580" r="1.5"/><circle cx="1160" cy="540" r="1.5"/>
      <circle cx="1050" cy="590" r="1.5"/><circle cx="60" cy="330" r="1.5"/><circle cx="1220" cy="360" r="1.5"/>
    </g>

    <!-- ── The notch island: flush top, rounded bottom, wrapping the camera cutout. ── -->
    <path d="M410 0 H870 V22 Q870 44 848 44 H432 Q410 44 410 22 Z" fill="#000"/>
    <!-- The physical notch it wraps (slightly lighter so it reads). -->
    <path d="M565 0 H715 V18 Q715 32 701 32 H579 Q565 32 565 18 Z" fill="#050505"/>
    <!-- Left flank: the mark, thinking. -->
    <g transform="translate(436 6) scale(0.32)">
      <use href="#ribbon" fill="none" stroke="url(#signature)" stroke-width="16" stroke-linecap="round"/>
    </g>
    <text x="476" y="28" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F6F2" opacity="0.92">Listening</text>
    <!-- Right flank: live waveform. -->
    <g fill="#AAA7D9">
      <rect x="748" y="16" width="5" height="12" rx="2.5"><animate attributeName="height" values="6;20;9;16;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="19;9;17.5;11;19" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="758" y="12" width="5" height="20" rx="2.5"><animate attributeName="height" values="18;7;22;10;18" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="13;18.5;11;17;13" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="768" y="15" width="5" height="14" rx="2.5"><animate attributeName="height" values="10;24;12;18;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="17;10;16;13;17" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="778" y="18" width="5" height="8" rx="2.5"><animate attributeName="height" values="8;16;6;20;8" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="18;14;19;12;18" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="788" y="16" width="5" height="12" rx="2.5"><animate attributeName="height" values="14;6;18;8;14" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="15;19;13;18;15" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
    <circle cx="840" cy="22" r="4" fill="#AAA7D9">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- ── The message card that drops below the notch. ── -->
    <rect x="370" y="58" width="540" height="96" rx="24" fill="#000"/>
    <rect x="370.5" y="58.5" width="539" height="95" rx="23.5" fill="none" stroke="#AAA7D9" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
    </rect>

    <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
      <!-- Each scene: 4s of a 20s loop. The question shows first, the answer lands 0.6s later. -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="20s" begin="0s" repeatCount="indefinite"/>
        <text x="398" y="94" font-size="15" fill="#AAA7D9">“where’s the export button?”</text>
        <text x="398" y="128" font-size="20" font-weight="600" fill="#F7F6F2">Right here — top right, next to Share. <tspan fill="#9AA88F">◉</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="20s" begin="4s" repeatCount="indefinite"/>
        <text x="398" y="94" font-size="15" fill="#AAA7D9">“put Safari on the left and Xcode on the right”</text>
        <text x="398" y="128" font-size="20" font-weight="600" fill="#F7F6F2">Done — Safari left, Xcode right.</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="20s" begin="8s" repeatCount="indefinite"/>
        <text x="398" y="94" font-size="15" fill="#AAA7D9">“text mom I’m running late”</text>
        <text x="398" y="128" font-size="20" font-weight="600" fill="#F7F6F2">New message to Mom · <tspan fill="#9AA88F">Send?</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="20s" begin="12s" repeatCount="indefinite"/>
        <text x="398" y="94" font-size="15" fill="#AAA7D9">“tell me when the build finishes”</text>
        <text x="398" y="128" font-size="20" font-weight="600" fill="#F7F6F2">Watching your screen for it. <tspan fill="#AAA7D9">◎</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="20s" begin="16s" repeatCount="indefinite"/>
        <text x="398" y="94" font-size="15" fill="#AAA7D9">“add this page to my brain”</text>
        <text x="398" y="128" font-size="20" font-weight="600" fill="#F7F6F2">Saved — it’s in your brain now.</text>
      </g>
    </g>

    <!-- ── A pointing marker, pulsing like the on-screen one. ── -->
    <g transform="translate(1040 250)">
      <circle r="10" fill="#9AA88F"/>
      <circle r="10" fill="none" stroke="#9AA88F" stroke-width="3">
        <animate attributeName="r" values="10;42" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#9AA88F" stroke-width="2">
        <animate attributeName="r" values="10;42" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.9;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- A numbered walkthrough box on the other side. -->
    <g transform="translate(150 230)">
      <rect width="170" height="64" rx="12" fill="none" stroke="#AAA7D9" stroke-width="2.5" stroke-dasharray="8 6">
        <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="22" y="17" width="126" height="30" rx="8" fill="#F7F6F2" fill-opacity="0.08"/>
      <text x="85" y="37" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="14" fill="#F7F6F2" fill-opacity="0.75">Export…</text>
      <circle cx="0" cy="0" r="13" fill="#AAA7D9"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Arial, sans-serif" font-size="14" font-weight="700" fill="#111210">1</text>
    </g>

    <!-- ── The mark, title and tagline. ── -->
    <g transform="translate(565 198) scale(1.5)">
      <use href="#ribbon" fill="none" stroke="#9AA88F" stroke-opacity="0.45" stroke-width="22" stroke-linecap="round" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
      </use>
      <use href="#ribbon" fill="none" stroke="url(#signature)" stroke-width="13" stroke-linecap="round"/>
    </g>

    <text x="640" y="418" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#F7F6F2">Wisp</text>
    <text x="640" y="466" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#F7F6F2" fill-opacity="0.68">A private AI companion that lives in your Mac’s notch.</text>

    <g font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
      <rect x="318" y="510" width="176" height="40" rx="20" fill="#F7F6F2" fill-opacity="0.06" stroke="#9AA88F" stroke-opacity="0.45"/>
      <text x="406" y="536" fill="#9AA88F">100% local</text>
      <rect x="510" y="510" width="260" height="40" rx="20" fill="#F7F6F2" fill-opacity="0.06" stroke="#C9CBC1" stroke-opacity="0.4"/>
      <text x="640" y="536" fill="#C9CBC1">hold ⌃⌥ and talk</text>
      <rect x="786" y="510" width="176" height="40" rx="20" fill="#F7F6F2" fill-opacity="0.06" stroke="#AAA7D9" stroke-opacity="0.5"/>
      <text x="874" y="536" fill="#AAA7D9">sees · acts</text>
    </g>
  </g>
</svg>
