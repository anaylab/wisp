<!doctype html>
<html lang="en">
<head><title>Sign in — Example Bank</title></head>
<body>
  <main>
    <h1>Sign in to Example Bank</h1>
    <p>Welcome back.</p>
    <form>
      <label>Email <input type="email" value="ada@example.com"></label>
      <label>Password <input type="password" value="hunter2-secret"></label>
      <label>Card <input autocomplete="cc-number" value="4111111111111111"></label>
      <label>Code <input autocomplete="one-time-code" value="928374"></label>
      <textarea>draft note text</textarea>
      <button>Sign in</button>
    </form>
    <div data-wisp-ignore>Account number 99887766 is private.</div>
    <p>Need help? Call us.</p>
  </main>
</body>
</html>
