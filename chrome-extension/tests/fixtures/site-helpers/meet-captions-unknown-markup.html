<!DOCTYPE html>
<!-- Captions in markup the selector table doesn't know: the region is still
     found by its role, and each child reads as "name, words". -->
<html lang="en">
<head><title>Meet - abc-defg-hij</title></head>
<body>
  <div role="region" aria-label="Captions">
    <div class="newBlock"><div class="who">Jordan</div><div class="said">can everyone see my screen</div></div>
  </div>
</body>
</html>
